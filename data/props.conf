# ===== 杜比总开关 =====
persist.vendor.dolby.global.enable=1
# ===== 人声 / 对白增强 =====
persist.vendor.dolby.dialog.enhancer.enable=1
persist.vendor.dolby.dialog.enhancer.amount=7
# ===== 音量均衡器 =====
persist.vendor.dolby.volume.leveler.enable=0
persist.vendor.dolby.volume.leveler.amount=0
# ===== 声场虚拟化 =====
persist.vendor.dolby.virtualizer.enable=1
persist.vendor.dolby.virtualizer.amount=6
# ===== 低频增强 =====
persist.vendor.dolby.bass.enable=1
persist.vendor.dolby.bass.boost=6
# ===== 高频细节 =====
persist.vendor.dolby.spectral.enable=1
persist.vendor.dolby.spectral.boost=7
# ===== IEQ / 后处理链 =====
persist.vendor.dolby.ieq.enable=0
vendor.dolby.dap.pcequal=0
vendor.dolby.dap.pctype=0
# ===== 低功耗限制 =====
persist.vendor.audio.low_power=false
persist.vendor.audio_hal.low_power=false
persist.vendor.audio.power.save.enable=0
persist.vendor.audio.power.save.setting=0
persist.vendor.audio.silencelowpower.support=false
persist.sys.miuix.volume.power_save=0
persist.sys.miui.audio.power_save=0
persist.sys.hyper.audio.power_save=0
